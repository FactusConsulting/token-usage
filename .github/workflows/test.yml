name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shim:
    name: shim format tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # Pinned and wheel-only: unpinned installs resolve to whatever is
        # newest at run time, and a source distribution executes setup code
        # during install.
        run: |
          pip install --quiet --only-binary :all: \
            pytest==9.1.1 \
            requests==2.34.2 \
            python-dotenv==1.2.2
      - name: Run tests
        run: python -m pytest shim/ -v

  chart:
    name: langfuse-stack chart (lint + guards)
    runs-on: ubuntu-latest
    env:
      CHART: charts/langfuse-stack
      VALUES: charts/langfuse-stack/ci/test-values.yaml
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA: a mutable tag on a third-party action can be
      # repointed at arbitrary code after review.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - name: Resolve dependencies
        # `helm dependency build` resolves Chart.lock against the local repo
        # list, so the upstream repo has to be registered first even though
        # Chart.yaml names its URL.
        run: |
          helm repo add langfuse https://langfuse.github.io/langfuse-k8s
          helm repo update
          helm dependency build "$CHART"
      - name: Lint
        run: $CHART/ci/render.sh lint
      - name: Renders with external state
        run: $CHART/ci/render.sh > /dev/null
      # Supplying the valkey-io storage values is not enough on its own: Helm
      # ignores values a chart does not declare, so if upstream renames
      # dataStorage again the render still succeeds and the PVC silently falls
      # back to the default size on the default StorageClass. That is the exact
      # regression ci/test-values.yaml exists to prevent, so assert the
      # rendered object rather than trusting the input.
      - name: Rendered Redis PVC honours ci/test-values.yaml
        run: |
          $CHART/ci/render.sh > /tmp/rendered.yaml
          python3 - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          pvcs = [d for d in docs if d['kind'] == 'PersistentVolumeClaim']
          if len(pvcs) != 1:
              sys.exit(f'expected exactly one PVC, got {[p["metadata"]["name"] for p in pvcs]}')
          spec = pvcs[0]['spec']
          got = (spec['resources']['requests']['storage'], spec.get('storageClassName'))
          want = ('1Gi', 'standard')
          if got != want:
              sys.exit(f'PVC {pvcs[0]["metadata"]["name"]}: expected {want}, got {got} — '
                       'the storage keys in ci/test-values.yaml no longer reach the sub-chart')
          print(f'PVC {pvcs[0]["metadata"]["name"]}: {got[0]} on {got[1]}')
          PY
      # Upstream 2.x bundles the ClickHouse operator, which does run v4, so
      # there is no longer a guard against that combination — it is a
      # supported configuration and has to keep rendering.
      #
      # --api-versions is required on every render that sets
      # clickhouse.deploy=true: offline rendering cannot discover the operator's
      # CRDs, so upstream's own crdCheck aborts first. Without it an assertion
      # that only checks "did this fail?" passes without ever reaching the
      # guard it claims to test — which is how the removed v4 guard step kept
      # reporting success after it stopped testing anything.
      - name: Bundled operator ClickHouse renders on a v4 tag
        run: |
          $CHART/ci/render.sh \
            --api-versions clickhouse.com/v1alpha1/ClickHouseCluster \
            --api-versions clickhouse.com/v1alpha1/KeeperCluster \
            --set langfuse.clickhouse.deploy=true \
            --set langfuse.langfuse.image.tag=4.35.0 > /dev/null
      - name: Guard rejects chart-owned state when required external
        run: |
          out=$($CHART/ci/render.sh \
                  --api-versions clickhouse.com/v1alpha1/ClickHouseCluster \
                  --api-versions clickhouse.com/v1alpha1/KeeperCluster \
                  --set guards.requireExternalState=true \
                  --set langfuse.clickhouse.deploy=true 2>&1) && {
            echo "guard did not fire: chart-owned ClickHouse rendered successfully"
            exit 1
          }
          echo "$out" | grep -q 'guards.requireExternalState is on' || {
            echo "render failed, but not on our guard:"
            echo "$out"
            exit 1
          }
      - name: Guard rejects the latest tag
        run: |
          if $CHART/ci/render.sh \
               --set langfuse.langfuse.image.tag=latest > /dev/null 2>&1; then
            echo "guard did not fire: tag 'latest' rendered successfully"
            exit 1
          fi
      - name: v4 with operator-managed ClickHouse renders
        run: |
          $CHART/ci/render.sh \
            --set langfuse.langfuse.image.tag=4.0.0 \
            --set clickhouseCluster.enabled=true \
            | grep -q '^kind: ClickHouseCluster'
