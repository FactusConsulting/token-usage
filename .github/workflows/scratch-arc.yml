name: scratch-arc
on:
  pull_request:
jobs:
  probe:
    runs-on: arc-runner
    steps:
      - uses: actions/checkout@v7
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip
      - name: Install gh CLI
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          GH_VERSION="2.103.3"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version; zip -v | head -2
          gh release view --repo "$GITHUB_REPOSITORY" "v0.0.0-nonexistent" >/dev/null 2>&1 && echo exists || echo "gh api works (release absent)"
          VERSION=9.9.9; name="token-usage-${VERSION}"
          git archive --format=tar --prefix="${name}/" HEAD | tar -xf -
          tar -czf "${name}.tar.gz" "${name}"
          (cd "${name}" && zip -qr "../${name}.zip" .)
          ls -la "${name}.zip" "${name}.tar.gz"
