name: auto-release

# Ship every ccusage bump without a manual tag.
#
# Renovate bumps CCUSAGE_VERSION in a PR. Once it lands on main, this workflow
# takes the next patch version after the newest v* tag, pushes that tag and
# runs release.yml. release.yml builds the tarball, publishes the Chocolatey
# feed and opens the homebrew-tap PR. Installed machines then pick the new
# ccusage up on their next `choco upgrade` / `brew upgrade`.
#
# release.yml is called directly rather than through the tag. A tag pushed with
# GITHUB_TOKEN does not trigger other workflows, so the `push: tags` route would
# do nothing.

on:
  push:
    branches: [main]
    paths: [CCUSAGE_VERSION]
  workflow_dispatch:

# Two bumps merged back to back must not both claim the same next version.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: arc-runner-public
    permissions:
      contents: write  # push the tag
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, to find the newest

      - name: Compute next patch tag
        id: next
        run: |
          set -euo pipefail
          # Skip if this commit is already released, for example on a re-run.
          existing="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)"
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing; re-releasing it."
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "latest=$latest next=$next ccusage=$(tr -d '\n' < CCUSAGE_VERSION)"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.next.outputs.new == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG: ccusage $(tr -d '\n' < CCUSAGE_VERSION)"
          git push origin "refs/tags/$TAG"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit  # HOMEBREW_TAP_TOKEN
    # A called workflow gets no more than the caller grants. release.yml needs
    # contents: write for the GitHub Release and the gh-pages feed.
    permissions:
      contents: write
